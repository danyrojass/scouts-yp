services:
  postgres:
    image: postgres:16-alpine
    container_name: scouts-yp-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: scouts_yp
      POSTGRES_USER: scouts_yp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouts_yp -d scouts_yp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scouts-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: scouts-yp-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scouts_yp:${DB_PASSWORD}@postgres:5432/scouts_yp
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scouts-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        API_URL: /api/v1
    container_name: scouts-yp-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - scouts-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: scouts-yp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - scouts-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  scouts-network:
    driver: bridge
